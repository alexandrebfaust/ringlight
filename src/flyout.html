<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ringlight</title>
  <link rel="stylesheet" href="flyout.css" />
</head>
<body>
  <div class="panel off" id="panel">
    <header>
      <div class="dot" aria-hidden="true"></div>
      <div class="title"><strong>Ringlight</strong><span id="status"></span></div>
      <button type="button" class="icon" id="open" data-i18n-title="open_app" data-i18n-aria="open_app">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M9.4 1.3 9.7 3a5 5 0 0 1 1.2.7l1.6-.6 1.4 2.4-1.3 1.1a5 5 0 0 1 0 1.4l1.3 1.1-1.4 2.4-1.6-.6a5 5 0 0 1-1.2.7l-.3 1.7H6.6L6.3 13a5 5 0 0 1-1.2-.7l-1.6.6-1.4-2.4 1.3-1.1a5 5 0 0 1 0-1.4L2.1 6.9l1.4-2.4 1.6.6A5 5 0 0 1 6.3 4l.3-1.7h2.8ZM8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Z" />
        </svg>
      </button>
      <label class="switch">
        <input type="checkbox" id="enabled" data-i18n-aria="toggle" />
        <span></span>
      </label>
    </header>

    <div class="body">
      <div class="dial" id="dial" role="slider" tabindex="0" aria-valuemin="10" aria-valuemax="100" data-i18n-aria="intensity">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="50" />
          <circle class="value" id="dialValue" cx="60" cy="60" r="50" />
          <circle class="knob" id="dialKnob" r="5" />
        </svg>
        <div class="readout">
          <b id="dialText"></b>
          <small data-i18n="intensity"></small>
        </div>
      </div>

      <div class="side">
        <div class="presets" id="presets"></div>
        <div class="bar-row">
          <div class="bar">
            <input type="range" id="kelvin" min="2000" max="9000" step="100" data-i18n-aria="temperature" />
            <output id="kelvinOut"></output>
          </div>
          <button type="button" class="square" id="camera" aria-pressed="false" data-i18n-title="auto_camera" data-i18n-aria="auto_camera">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
              <rect x="2" y="5.5" width="11" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M13 9l4.5-2.5v7L13 11z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="flyout.js"></script>
</body>
</html>
