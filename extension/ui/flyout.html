<!doctype html>
<!-- Generated from src/flyout.html by scripts/sync-extension.mjs. Edit the original. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ringlight</title>
  <link rel="stylesheet" href="flyout.css" />
</head>
<body>
  <div class="panel off" id="panel">
    <header>
      <div class="dot" aria-hidden="true"></div>
      <div class="title"><strong>Ringlight</strong><span id="status"></span></div>
      <button type="button" class="icon" id="open" data-i18n-title="open_app" data-i18n-aria="open_app">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M9.4 1.3 9.7 3a5 5 0 0 1 1.2.7l1.6-.6 1.4 2.4-1.3 1.1a5 5 0 0 1 0 1.4l1.3 1.1-1.4 2.4-1.6-.6a5 5 0 0 1-1.2.7l-.3 1.7H6.6L6.3 13a5 5 0 0 1-1.2-.7l-1.6.6-1.4-2.4 1.3-1.1a5 5 0 0 1 0-1.4L2.1 6.9l1.4-2.4 1.6.6A5 5 0 0 1 6.3 4l.3-1.7h2.8ZM8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Z" />
        </svg>
      </button>
      <label class="switch">
        <input type="checkbox" id="enabled" data-i18n-aria="toggle" />
        <span></span>
      </label>
    </header>

    <div class="body">
      <div class="dial" id="dial" role="slider" tabindex="0" aria-valuemin="10" aria-valuemax="100" data-i18n-aria="intensity">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="50" />
          <circle class="value" id="dialValue" cx="60" cy="60" r="50" />
          <circle class="knob" id="dialKnob" r="5" />
        </svg>
        <div class="readout">
          <b id="dialText"></b>
          <small data-i18n="intensity"></small>
        </div>
      </div>

      <div class="side">
        <div class="presets" id="presets"></div>
        <div class="bar-row">
          <div class="bar">
            <input type="range" id="kelvin" min="2000" max="9000" step="100" data-i18n-aria="temperature" />
            <output id="kelvinOut"></output>
          </div>
          <button type="button" class="square" id="camera" aria-pressed="false" data-i18n-title="auto_camera" data-i18n-aria="auto_camera">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
              <rect x="2" y="5.5" width="11" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M13 9l4.5-2.5v7L13 11z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Compact versions of the main settings -->
    <div class="more">
      <div class="mini-seg" id="shape" role="radiogroup">
        <button type="button" role="radio" data-value="frame" data-i18n="shape_frame"></button>
        <button type="button" role="radio" data-value="oval" data-i18n="shape_oval"></button>
        <button type="button" role="radio" data-value="circle" data-i18n="shape_circle"></button>
        <button type="button" role="radio" data-value="bars" data-i18n="shape_bars"></button>
      </div>
      <div class="mini-seg" id="colorMode" role="radiogroup">
        <button type="button" role="radio" data-value="solid" data-i18n="mode_solid"></button>
        <button type="button" role="radio" data-value="linear" data-i18n="mode_linear"></button>
        <button type="button" role="radio" data-value="conic" data-i18n="mode_conic"></button>
        <button type="button" role="radio" data-value="sides" data-i18n="mode_sides"></button>
      </div>
      <div class="chips" id="gradients" data-panel="linear conic"></div>
      <div class="chips" id="sides" data-panel="sides"></div>

      <div class="mini-seg" id="effect" role="radiogroup">
        <button type="button" role="radio" data-value="none" data-i18n="effect_none"></button>
        <button type="button" role="radio" data-value="rotate" data-i18n="effect_rotate"></button>
        <button type="button" role="radio" data-value="pulse" data-i18n="effect_pulse"></button>
        <button type="button" role="radio" data-value="hue" data-i18n="effect_hue_short"></button>
      </div>

      <div class="sliders">
        <label class="mini-slider" id="speedRow"><span data-i18n="speed"></span><input type="range" id="speed" min="1" max="10" step="1" data-unit="" /><output data-for="speed"></output></label>
        <label class="mini-slider"><span data-i18n="opacity"></span><input type="range" id="opacity" min="5" max="100" step="1" data-unit="%" /><output data-for="opacity"></output></label>
        <label class="mini-slider"><span data-i18n="thickness"></span><input type="range" id="thickness" min="4" max="1000" step="1" data-unit=" px" /><output data-for="thickness"></output></label>
        <label class="mini-slider"><span data-i18n="softness"></span><input type="range" id="softness" min="0" max="200" step="1" data-unit=" px" /><output data-for="softness"></output></label>
        <label class="mini-slider"><span data-i18n="radius_short"></span><input type="range" id="radius" min="0" max="300" step="1" data-unit=" px" /><output data-for="radius"></output></label>
      </div>

      <label class="mini-toggle" data-feature="shrinkPage" data-i18n-title="shrink_page_hint">
        <span data-i18n="shrink_page_short"></span>
        <input type="checkbox" id="shrinkPage" />
        <i aria-hidden="true"></i>
      </label>
    </div>
  </div>

  <script src="backend.js"></script>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="flyout.js"></script>
</body>
</html>
