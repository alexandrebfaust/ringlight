[package]
name = "ringlight"
version = "0.1.0"
description = "Ringlight de tela para reuniões"
edition = "2021"

[lib]
name = "ringlight_lib"
# Só rlib: staticlib/cdylib servem para mobile, e o cdylib estoura o limite
# de símbolos exportados de DLL no toolchain GNU.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
